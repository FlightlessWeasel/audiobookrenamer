name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend typecheck, test, build
        working-directory: web
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: sigstore/cosign-installer@v3

      - name: Verify committed cosign public key matches the signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/derived.pub
          if ! diff -u internal/selfupdate/keys/cosign.pub /tmp/derived.pub; then
            echo "::error::internal/selfupdate/keys/cosign.pub does not match COSIGN_PRIVATE_KEY."
            echo "The shipped binary would reject this release. Commit the correct public key."
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs checksums.txt so the in-app updater will accept the release.
          # Create these once with `cosign generate-key-pair` and add them as
          # repo secrets; commit the public half to
          # internal/selfupdate/keys/cosign.pub.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
